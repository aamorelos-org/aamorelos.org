sonar.projectKey=aamorelos.org
sonar.projectName=aamorelos.org
sonar.projectVersion=0.0.0
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx
sonar.exclusions=**/node_modules/**,coverage/**,public/**,dist/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
# Cobertura honesta: solo contamos lo testeable en unit tests
# (no hay framework de testing de UI en el proyecto; las vistas se
# analizan igual para calidad, pero no inflan el gate con 0% garantizado)
sonar.coverage.exclusions=src/utils/image.js,src/views/**,src/components/**,src/hooks/**,src/App.jsx,src/main.jsx
